description: >-
  FinOps view of Tekmetric spend. The dominant cost is the per-shop SaaS
  subscription (Start/Grow/Scale/Enterprise, plus optional per-shop add-ons
  such as Multi-Shop Management, Tire Suite, and Marketing), billed flat per
  location per month regardless of user count or repair order volume. The
  partner API sits outside this published pricing - it is gated behind manual
  approval at api.tekmetric.com with no public API-specific price list, so it
  is not known whether API usage carries an incremental charge beyond an
  active shop subscription.
notes: >-
  Because Tekmetric bills flat per shop rather than per API call or per
  record, FinOps optimization for this provider is mostly about right-sizing
  the subscription tier and add-ons per location rather than API usage
  metering.
