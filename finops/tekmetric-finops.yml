meters:
- name: shop_subscription
  description: Flat monthly fee per shop location for the Start/Grow/Scale/Enterprise tier.
  unit: shops
  aggregation: sum
  dimensions:
  - shop
  - tier
- name: addon_subscription
  description: Flat monthly fee per shop for optional add-ons (Multi-Shop Management, Tire Suite, Marketing).
  unit: shops
  aggregation: sum
  dimensions:
  - shop
  - addon
- name: api_access
  description: Cost of partner API access, if any - not publicly published; verify with Tekmetric after approval.
  unit: contracts
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track subscription tier and enabled add-ons per shop location; request written API-access terms from Tekmetric since none are published.
- name: Allocation
  description: Map each shop subscription and its add-ons to the owning location/franchisee for cost accountability.
- name: Optimization
  description: Right-size the subscription tier (Start/Grow/Scale) to the features actually used per shop rather than defaulting every location to the top tier; disable unused add-ons.
- name: Accountability
  description: Assign an owner per shop subscription and review tier/add-on fit against usage on a recurring cadence.
